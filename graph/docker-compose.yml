services:
  neo4j:
    # Community edition has no role-based access control: every account can write,
    # so the API's read-principal check only warns here (see docs/CONFIGURATION.md).
    image: neo4j:5.26
    container_name: rootstock-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:?Set NEO4J_AUTH, for example neo4j/CHANGE_ME}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      # Server-side backstop for LOAD CSV: refuse file:// URLs even if a query slips through.
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./browser:/import/rootstock:ro   # Browser guide, GraSS, saved queries
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
