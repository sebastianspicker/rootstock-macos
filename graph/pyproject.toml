[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rootstock-graph"
version = "0.1.0"
description = "Rootstock graph import and query engine"
requires-python = ">=3.10"
dependencies = [
    "neo4j==5.28.4",
    "pydantic==2.13.4",
    "tabulate==0.10.0",
    "fastapi==0.137.0",
    "httpx==0.28.1",
    "uvicorn==0.49.0",
    "requests==2.34.2",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.0", "ruff==0.15.17"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
