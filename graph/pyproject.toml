[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rootstock-graph"
version = "0.1.0a1"
description = "Rootstock graph import and query engine"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "Sebastian Spicker" }]
dependencies = [
    "neo4j>=5.0,<6.0",
    "pydantic>=2.4,<3.0",
    "tabulate>=0.9,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "requests>=2.33,<3.0",
    "Markdown>=3,<4",
    "jsonschema>=4.0,<5.0",
    "rfc3339-validator>=0.1.4,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest",
    "ruff==0.16.10",
]

[project.scripts]
rootstock-graph-investigate = "rootstock_graph.investigation.cli:main"
rootstock-graph-api = "rootstock_graph.api:main"
rootstock-graph-bloodhound-import = "rootstock_graph.ingestion.bloodhound_import:main"
rootstock-graph-clear-owned = "rootstock_graph.inference.clear_owned:main"
rootstock-graph-cve-enrichment = "rootstock_graph.vulnerability.cve_enrichment_cli:main"
rootstock-graph-diff-scans = "rootstock_graph.reporting.diff_scans:main"
rootstock-graph-import-cve-scan = "rootstock_graph.ingestion.import_cve_scan:main"
rootstock-graph-import-family-export = "rootstock_graph.ingestion.import_family_export:main"
rootstock-graph-import-scan = "rootstock_graph.ingestion.import_scan:main"
rootstock-graph-import-vulnerabilities = "rootstock_graph.ingestion.import_vulnerabilities:main"
rootstock-graph-infer = "rootstock_graph.inference.infer:main"
rootstock-graph-mark-owned = "rootstock_graph.inference.mark_owned:main"
rootstock-graph-merge-scans = "rootstock_graph.ingestion.merge_scans:main"
rootstock-graph-opengraph-export = "rootstock_graph.reporting.opengraph_export:main"
rootstock-graph-query = "rootstock_graph.reporting.query_runner:main"
rootstock-graph-report = "rootstock_graph.reporting.report:main"
rootstock-graph-report-graphviz = "rootstock_graph.reporting.report_graphviz:main"
rootstock-graph-setup-schema = "rootstock_graph.ingestion.setup_schema:main"
rootstock-graph-tier-classification = "rootstock_graph.inference.tier_classification:main"
rootstock-graph-validate-scan = "rootstock_graph.ingestion.validate_scan:main"
rootstock-graph-viewer = "rootstock_graph.reporting.viewer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rootstock_graph = [
    "resources/queries/*.cypher",
    "resources/queries/README.md",
    "resources/contracts/collector-scan/legacy-unversioned.schema.json",
    "resources/contracts/family-open-export/v1/schema.json",
    "resources/contracts/cve-scan-export/v7/schema.json",
    "resources/contracts/README.md",
    "resources/viewer/*.css",
    "resources/viewer/*.html",
    "resources/viewer/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
