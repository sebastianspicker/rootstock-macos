exclude_paths:
  - "archive/**"
  - "release/**"
  - "docs/archive/**"
  - "docs/private/**"
  - "docs/generated/**"
  - ".codacy/generated/**"
  - ".codacy/logs/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/__pycache__/**"
  - "**/.mypy_cache/**"
  - "**/.pytest_cache/**"
  - "**/.ruff_cache/**"
  - "**/.tox/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/*.egg-info/**"
  - "graph/generated/**"
  - "graph/src/rootstock_graph/resources/viewer/viewer.bundle.js"
  # Generated from graph/viewer/css by bundle-viewer-css.mjs
  - "graph/src/rootstock_graph/resources/viewer/viewer.css"
  # Keep-a-Changelog repeats Added/Changed/Fixed headings per release
  - "CHANGELOG.md"
  - "**/CHANGELOG.md"
  # CI/dev verification scripts and demo fixture generators
  - "scripts/check-*.py"
  - "graph/scripts/check-*.py"
  - "graph/viewer/scripts/viewer-demo-*.mjs"

engines:
  # Complexity is enforced in CI with the project's own limits (ruff C901 and
  # SwiftLint cyclomatic_complexity at 8, ESLint complexity 8, SwiftLint
  # function_body_length 60, scripts/check-source-size.py). Lizard repeats those
  # checks with a different count and stricter defaults, and reads lockfiles as code.
  lizard:
    exclude_paths:
      - "**"
  # CSS is linted and formatted by Biome (graph/viewer/biome.json); Stylelint's
  # defaults conflict with it.
  stylelint:
    exclude_paths:
      - "**/*.css"
