name: Set up locked uv and Python
description: >-
  Install uv 0.11.12 and Python 3.11 with the uv cache enabled. Used by
  test.yml.
inputs:
  working-directory:
    description: Project directory used to locate uv.lock for the cache key
    required: false
    default: "."
  cache-dependency-glob:
    description: Glob for the uv cache key
    required: false
    default: "**/uv.lock"
runs:
  using: composite
  steps:
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "0.11.12"
        python-version: "3.11"
        enable-cache: true
        working-directory: ${{ inputs.working-directory }}
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}
