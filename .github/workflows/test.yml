name: Tests

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/archive/**"
      - "docs/private/**"
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "docs/archive/**"
      - "docs/private/**"

permissions:
  contents: read

jobs:
  swift-tests:
    name: Swift Tests
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build fixture apps
        run: bash tests/fixtures/apps/create_fixtures.sh
      - name: swift test
        working-directory: collector
        timeout-minutes: 55
        run: swift test --parallel

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -a bolt://localhost:7687 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: graph
        run: pip install -r requirements.txt pytest
      - name: Validate demo scan contract
        run: python3 scripts/validate-scan.py examples/demo-scan.json
      - name: Viewer performance contract
        working-directory: graph
        run: timeout 30s node tests/viewer_performance.js
      - name: pytest graph required Neo4j lane
        working-directory: graph
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_AUTH: none
          ROOTSTOCK_REQUIRE_NEO4J: "1"
        run: pytest tests/ -v --tb=short
      - name: graph pipeline smoke with Neo4j
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_AUTH: none
        run: bash tests/integration/test_full_pipeline.sh

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check graph/ scripts/ examples/ docs/ --exclude docs/archive --exclude docs/private

  cve-scan-tests:
    name: cve-scan Module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install cve-scan dependencies
        working-directory: modules/cve-scan
        run: pip install -e '.[dev]'
      - name: ruff check
        working-directory: modules/cve-scan
        run: ruff check .
      - name: pytest
        working-directory: modules/cve-scan
        run: pytest
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck modules/cve-scan/scripts/perf-smoke.sh

  shell-lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck examples/regenerate.sh graph/pipeline.sh scripts/*.sh tests/integration/*.sh
