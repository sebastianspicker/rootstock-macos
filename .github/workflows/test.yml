name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-surface:
    name: Release Surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Validate tracked public alpha surface
        run: ROOTSTOCK_VERIFY_REQUIRE_CLEAN=1 sh scripts/verify release

  quality:
    # Preserve the required status name configured on the protected main branch.
    name: Python Lint
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Node and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: graph/viewer/.node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            graph/viewer/package-lock.json
      - name: Set up locked npm
        run: npm install --global npm@11.17.0 --ignore-scripts
      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"
      - name: Install locked repository quality tools
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Install locked viewer quality tools
        working-directory: graph/viewer
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Install locked Python quality tools
        run: |
          uv sync --project graph --locked --all-extras
          uv sync --project modules/cve-scan --locked --all-extras
      - name: Install verified SwiftLint 0.65.0
        run: |
          swiftlint_tmp=$(mktemp -d "$RUNNER_TEMP/rootstock-swiftlint.XXXXXX")
          archive="$swiftlint_tmp/SwiftLintBinary.artifactbundle.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/realm/SwiftLint/releases/download/0.65.0/SwiftLintBinary.artifactbundle.zip
          printf '%s  %s\n' \
            eb333bd76dfb5f46d21fdf3615fe39bb938956ca0b8e94c241c4b2db6e696b90 \
            "$archive" | shasum -a 256 -c -
          ditto -x -k "$archive" "$swiftlint_tmp/unpacked"
          swiftlint_bin="$swiftlint_tmp/unpacked/SwiftLintBinary.artifactbundle/macos/swiftlint"
          test "$("$swiftlint_bin" version)" = "0.65.0"
          echo "SWIFTLINT_BIN=$swiftlint_bin" >> "$GITHUB_ENV"
      - name: Verify quality ratchet
        run: sh scripts/verify quality

  web-viewer:
    name: Viewer static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Node and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: graph/viewer/.node-version
          cache: npm
          cache-dependency-path: graph/viewer/package-lock.json
      - name: Set up locked npm
        run: npm install --global npm@11.17.0 --ignore-scripts
      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"
      - name: Install locked viewer dependencies
        working-directory: graph/viewer
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Verify viewer workspaces
        run: sh scripts/verify web

  swift-tests:
    name: Swift Tests
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Verify Swift 6.3 toolchain
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -F "Apple Swift version 6.3"
      - name: Verify collector
        timeout-minutes: 55
        run: sh scripts/verify swift-core

  product-family-swift-tests:
    name: Product Family Swift ${{ matrix.swift }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.2"
            developer_dir: /Applications/Xcode_26.2.app/Contents/Developer
          - swift: "6.3"
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.11"
          enable-cache: true
          working-directory: graph
      - name: Install graph importer
        working-directory: graph
        run: uv sync --locked --all-extras
      - name: Verify Swift ${{ matrix.swift }} toolchain
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -F "Apple Swift version ${{ matrix.swift }}"
      - name: Verify product family
        run: sh scripts/verify swift-family

  graph:
    # Preserve the required status name configured on the protected main branch.
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.11"
          enable-cache: true
          working-directory: graph
      - name: Install dependencies
        working-directory: graph
        run: uv sync --locked --all-extras
      - name: Verify graph package and contracts
        run: sh scripts/verify graph

  cve-scan-tests:
    name: cve-scan Module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.11"
          enable-cache: true
          working-directory: modules/cve-scan
      - name: Install cve-scan dependencies
        working-directory: modules/cve-scan
        run: uv sync --locked --all-extras
      - name: Verify cve-scan
        run: sh scripts/verify cve

  shell-lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Verify shell sources
        run: sh scripts/verify shell
