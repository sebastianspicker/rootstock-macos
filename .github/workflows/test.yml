name: Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Shared path filters: the macOS jobs are the expensive ones, so they only run
# when a Swift product, the shared package, a contract, or the lanes change.
# Job names are preserved because branch protection references them.

jobs:
  release-surface:
    name: Release Surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Validate tracked public alpha surface
        run: ROOTSTOCK_VERIFY_REQUIRE_CLEAN=1 sh scripts/verify release

  quality:
    # Preserve the required status name configured on the protected main branch.
    name: Python Lint
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
        with:
          cache-dependency-path: |
            package-lock.json
            graph/viewer/package-lock.json
      - name: Install locked repository quality tools
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Install locked viewer quality tools
        working-directory: graph/viewer
        run: npm ci --no-audit --no-fund --ignore-scripts
      - uses: ./.github/actions/setup-uv
        with:
          cache-dependency-glob: "**/uv.lock"
      - name: Install locked Python quality tools
        run: |
          uv sync --project graph --locked --all-extras
          uv sync --project modules/cve-scan --locked --all-extras
      - name: Install verified SwiftLint 0.65.0
        run: |
          swiftlint_bin=$(sh scripts/install-swiftlint.sh "$RUNNER_TEMP/rootstock-swiftlint") || exit 1
          test -x "$swiftlint_bin"
          echo "SWIFTLINT_BIN=$swiftlint_bin" >> "$GITHUB_ENV"
      - name: Verify quality ratchet
        run: sh scripts/verify quality

  web-viewer:
    name: Viewer static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-npm
      - name: Install locked viewer dependencies
        working-directory: graph/viewer
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Verify viewer workspaces
        run: sh scripts/verify web

  swift-paths:
    # Decides whether the macOS Swift jobs need to run for this change.
    name: Swift change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Swift-relevant changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(collector/|packages/|rootstock-red/|rootstock-blue/|contracts/|scripts/|examples/|\.swiftlint\.yml|\.github/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  swift-tests:
    name: Swift Tests
    needs: swift-paths
    if: needs.swift-paths.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Verify Swift 6.3 toolchain
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -F "Apple Swift version 6.3"
      - name: Build the collector
        timeout-minutes: 55
        run: sh scripts/verify swift-core

  product-family-swift-tests:
    name: Product Family Swift ${{ matrix.swift }}
    needs: swift-paths
    if: needs.swift-paths.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.2"
            developer_dir: /Applications/Xcode_26.2.app/Contents/Developer
          - swift: "6.3"
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          working-directory: graph
      - name: Install graph importer
        working-directory: graph
        run: uv sync --locked --all-extras
      - name: Verify Swift ${{ matrix.swift }} toolchain
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -F "Apple Swift version ${{ matrix.swift }}"
      - name: Verify the product family
        run: sh scripts/verify swift-family

  graph:
    # Preserve the required status name configured on the protected main branch.
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          working-directory: graph
      - name: Install dependencies
        working-directory: graph
        run: uv sync --locked --all-extras
      - name: Lint and smoke the graph package
        run: sh scripts/verify graph

  neo4j-pipeline:
    name: Neo4j pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        # Community edition, as in graph/docker-compose.yml. It has no role-based
        # access control, so the read account is a separate login without a reader role.
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/rootstock-ci-password
          NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: rootstock-ci-password
      NEO4J_READ_USER: rootstock_reader
      NEO4J_READ_PASSWORD: rootstock-ci-reader
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          working-directory: graph
      - name: Install dependencies
        working-directory: graph
        run: uv sync --locked --all-extras
      - name: Create the separate read account
        run: |
          uv run --project graph --locked python - <<'PY'
          import os
          from neo4j import GraphDatabase
          driver = GraphDatabase.driver(os.environ["NEO4J_URI"], auth=(os.environ["NEO4J_USER"], os.environ["NEO4J_PASSWORD"]))
          with driver.session(database="system") as session:
              session.run("CREATE USER $user IF NOT EXISTS SET PASSWORD $password CHANGE NOT REQUIRED",
                          user=os.environ["NEO4J_READ_USER"], password=os.environ["NEO4J_READ_PASSWORD"])
          driver.close()
          PY
      - name: Run the pipeline and API against the service container
        run: sh scripts/verify neo4j

  cve-scan-tests:
    name: cve-scan Module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          working-directory: modules/cve-scan
      - name: Install cve-scan dependencies
        working-directory: modules/cve-scan
        run: uv sync --locked --all-extras
      - name: Lint cve-scan
        run: sh scripts/verify cve

  shell-lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Verify shell sources
        run: sh scripts/verify shell
