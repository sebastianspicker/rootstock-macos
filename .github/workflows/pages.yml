name: Build synthetic viewer demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "graph/viewer/**"
      - "graph/src/rootstock_graph/resources/viewer/**"
      - "docs/assets/screenshots/**"
      - "scripts/verify"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "graph/viewer/**"
      - "graph/src/rootstock_graph/resources/viewer/**"
      - "docs/assets/screenshots/**"
      - "scripts/verify"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: graph/viewer/.node-version
          cache: npm
          cache-dependency-path: graph/viewer/package-lock.json

      - name: Set up locked npm
        run: npm install --global npm@11.17.0 --ignore-scripts

      - name: Install locked dependencies
        working-directory: graph/viewer
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Verify maintained viewer
        run: sh scripts/verify web

      - name: Build static demo
        working-directory: graph/viewer
        run: npm run demo:build

      - name: Verify static demo artifact
        working-directory: graph/viewer
        run: npm run demo:verify

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: graph/generated/pages-demo

  deploy:
    name: Deploy static demo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
