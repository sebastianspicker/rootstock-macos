name: CodeQL

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "deprecated/**"
      - "docs/archive/**"
      - "docs/deprecated/**"
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "deprecated/**"
      - "docs/archive/**"
      - "docs/deprecated/**"
  schedule:
    - cron: "37 4 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            os: ubuntu-latest
            build-mode: none
          - language: swift
            os: macos-14
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Swift collector
        if: matrix.language == 'swift'
        working-directory: collector
        run: swift build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
