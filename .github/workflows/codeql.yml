name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "deprecated/**"
      - "docs/archive/**"
      - "docs/deprecated/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "deprecated/**"
      - "docs/archive/**"
      - "docs/deprecated/**"
  schedule:
    - cron: "37 4 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            os: ubuntu-latest
            build-mode: none
          - language: swift
            os: macos-26
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build Swift packages
        if: matrix.language == 'swift'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          swift --version | grep -F "Apple Swift version 6.3"
          swift build --package-path collector \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors
          swift build --package-path packages/RootstockMacFacts
          swift build --package-path rootstock-red
          swift build --package-path rootstock-blue

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
